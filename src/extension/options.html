<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SealChat CRPG View 选项</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="options">
      <h1>SealChat CRPG View 选项</h1>
      <label><span>SealChat 地址</span><input data-setting="sealChatUrl" type="url" placeholder="https://chat.example.com" /></label>
      <label><span>启用</span><input data-setting="enabled" type="checkbox" /></label>
      <label><span>显示 SealChat iframe</span><input data-setting="showSealChatFrame" type="checkbox" /></label>
      <label><span>显示页面内设置入口</span><input data-setting="showPageControls" type="checkbox" /></label>
      <label><span>打字速度（毫秒/字）</span><input data-setting="typingSpeed" type="number" min="5" max="500" /></label>
      <label><span>对话字号</span><input data-setting="fontSize" type="number" min="12" max="48" /></label>
      <label><span>句末等待时间（秒）</span><input data-setting="endDelay" type="number" min="0" max="60" /></label>
      <label><span>背景颜色</span><input data-setting="backgroundColor" type="color" /></label>
      <label><span>字体颜色</span><input data-setting="textColor" type="color" /></label>
      <label><span>角色名颜色</span><input data-setting="accentColor" type="color" /></label>
      <label><span>默认头像 URL</span><input data-setting="avatarUrl" type="url" /></label>
      <button data-action="save">保存并同步到当前页面</button>
      <p class="status" data-role="status"></p>
    </main>
    <script src="./options.js"></script>
  </body>
</html>
